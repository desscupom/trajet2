name: Build iOS no macOS (sem EAS cache)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submeter para App Store Connect depois?'
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS no macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS (gera pasta ios/ com Podfile correto)
        run: npx expo prebuild --platform ios --no-install

      - name: Garantir JSC no Podfile.properties.json
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('ios/Podfile.properties.json'));
            p['expo.jsEngine'] = 'jsc';
            p['newArchEnabled'] = 'false';
            fs.writeFileSync('ios/Podfile.properties.json', JSON.stringify(p, null, 2));
            console.log('Podfile.properties.json:', JSON.stringify(p, null, 2));
          "

      - name: Confirma que Hermes está desativado
        run: |
          echo "=== Linha hermes_enabled no Podfile ==="
          grep "hermes_enabled" ios/Podfile

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build e Upload para App Store Connect
        run: eas build --platform ios --profile production --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit para App Store Connect
        if: ${{ inputs.submit == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
