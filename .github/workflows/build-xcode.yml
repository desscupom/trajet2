name: Build iOS no macOS (sem EAS cache)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submeter para App Store Connect depois?'
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS no macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Criar .env com as chaves
        run: |
          cat > .env << ENVEOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PEXELS_API_KEY=${{ secrets.EXPO_PUBLIC_PEXELS_API_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY=${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_USE_EDGE_FUNCTION=${{ secrets.EXPO_PUBLIC_USE_EDGE_FUNCTION }}
          ENVEOF

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS (New Arch + JSC)
        run: npx expo prebuild --platform ios --no-install

      - name: Forçar JSC no Podfile.properties.json
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('ios/Podfile.properties.json'));
            p['expo.jsEngine'] = 'jsc';
            p['newArchEnabled'] = 'true';
            fs.writeFileSync('ios/Podfile.properties.json', JSON.stringify(p, null, 2));
            console.log('Config:', JSON.stringify(p, null, 2));
          "

      - name: Confirma hermes=false no Podfile
        run: grep "hermes_enabled" ios/Podfile

      - name: Instalar CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Build iOS via EAS
        run: eas build --platform ios --profile production --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: 1

      - name: Submit para App Store Connect
        if: ${{ inputs.submit == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
