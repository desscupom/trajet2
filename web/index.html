<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trajet — Planeje viagens com inteligência</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #0a0e1a 0%, #161c2e 100%);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .logo {
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .tagline {
    font-size: 18px;
    color: #94a3b8;
    max-width: 520px;
    line-height: 1.5;
    margin-bottom: 32px;
  }
  .footer {
    margin-top: 64px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="logo">Trajet</div>
  <p class="tagline">
    Planeje viagens com roteiros inteligentes, controle de despesas
    e tudo organizado em um só app.
  </p>
  <p class="footer">© Trajet</p>
</body>
</html>
